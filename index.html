<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0c10" />
  <title>Daily Memories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Daily Memories</h1>
      </div>
      <div class="header-actions" id="header-actions" hidden>
        <button id="audio-toggle-btn" class="icon-btn" title="Toggle Audio" aria-label="Toggle Audio" hidden>
          <span id="audio-icon">🎵</span>
          <span class="btn-label" id="audio-track-label">Audio</span>
        </button>
        <button id="audio-next-btn" class="icon-btn" title="Next Audio Track" aria-label="Next Audio Track" hidden>
          <span>⏭</span>
        </button>
        <button id="sign-out-btn" class="icon-btn" title="Sign Out" aria-label="Sign Out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span class="btn-label">Sign Out</span>
        </button>
      </div>
    </header>

    <!-- View 1: Sign In -->
    <main id="auth-view" class="center-view">
      <div class="glass-card auth-card">
        <div class="hero-icon">✨</div>
        <h2>Family Daily Memories</h2>
        <p>Sign in with Google to view 5 curated family photos and 1 featured video every day.</p>
        <button id="sign-in-btn" class="primary-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81Z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
        <p id="auth-error" class="error-text" hidden></p>
      </div>
    </main>

    <!-- View 2: Scanning Progress -->
    <main id="loading-view" class="center-view" hidden>
      <div class="glass-card loading-card">
        <div class="spinner"></div>
        <h2 id="loading-title">Curating Today's Memories</h2>
        <p id="loading-status">Scanning family archive...</p>
      </div>
    </main>

    <!-- View 3: Daily Memories Dashboard (No Scrolling Feed) -->
    <main id="memories-view" class="memories-dashboard" hidden>
      <!-- Top Section: Full-Width Photo Slideshow -->
      <section class="slideshow-section" aria-label="Daily Photo Memories">
        <div class="progress-bars" id="slideshow-progress"></div>

        <div id="slideshow-stage" class="slideshow-stage">
          <!-- Slides injected dynamically -->
        </div>

        <div class="slideshow-overlay-bottom">
          <div class="memory-meta">
            <span class="memory-badge" id="today-date-label">Today's Memories</span>
            <p class="photo-date" id="active-photo-date"></p>
          </div>
          <div class="slideshow-controls">
            <button id="prev-slide-btn" class="circle-nav-btn" aria-label="Previous photo">‹</button>
            <button id="next-slide-btn" class="circle-nav-btn" aria-label="Next photo">›</button>
          </div>
        </div>
      </section>

      <!-- Bottom Section: Daily Video & Surprise Button -->
      <section class="bottom-deck">
        <!-- Daily Featured Video Card -->
        <div class="video-card" id="daily-video-card">
          <div class="video-thumb-wrapper" id="video-trigger" role="button" tabindex="0" aria-label="Play Daily Video">
            <img id="daily-video-thumb" alt="Daily video thumbnail" />
            <div class="video-scrim"></div>
            <div class="play-button-circle">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="6 4 20 12 6 20 6 4"></polygon>
              </svg>
            </div>
            <div class="video-info">
              <span class="video-tag">Featured Video</span>
              <span class="video-date" id="daily-video-date"></span>
            </div>
          </div>
          <div id="no-video-state" class="no-video-box" hidden>
            <span>No videos found in archive</span>
          </div>
        </div>

        <!-- Surprise Me Action -->
        <div class="surprise-wrapper">
          <button id="surprise-btn" class="surprise-btn">
            <span class="dice-icon">🎲</span>
            <span>Surprise Me</span>
          </button>
        </div>
      </section>
    </main>

    <!-- Modal Overlay for Video Playback & Surprise Memories -->
    <div id="media-modal" class="modal-backdrop" hidden aria-modal="true" role="dialog">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-meta">
            <span id="modal-badge" class="memory-badge">Memory</span>
            <span id="modal-date" class="modal-date-text"></span>
          </div>
          <div class="modal-actions">
            <button id="modal-another-btn" class="secondary-btn small-btn" hidden>🎲 Another</button>
            <button id="close-modal-btn" class="close-modal-btn" aria-label="Close modal">✕</button>
          </div>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>
  </div>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Application Script -->
  <script src="apps/app.js"></script>
</body>
</html>
