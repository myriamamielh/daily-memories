<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090d16" />
  <title>Daily Memories</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-text">
        <h1>Daily Memories</h1>
        <p id="date-subtitle" class="subtitle"></p>
      </div>
      <button id="signout-btn" class="btn-ghost hidden" aria-label="Sign out">Sign Out</button>
    </header>

    <!-- View 1: Sign-In Screen -->
    <main id="auth-view" class="view active">
      <div class="card hero-card">
        <div class="icon-badge">📸</div>
        <h2>Your Shared Moments</h2>
        <p>Sign in with Google to view 5 random photos and 1 video each day directly from your shared Drive folder. Nothing is stored on this site.</p>
        <button id="signin-btn" class="btn-primary">
          <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
